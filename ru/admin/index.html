<style>
:root{--r:12px;--rl:16px;--rx:20px;--bg:#0d1526;--bg2:#131c33;--card:#182444;--hov:#1d2b4f;--t:#f2f4fa;--t2:#a6b0cc;--t3:#77819e;--accent:#FFD700;--accent2:#ffe14d;--glow:rgba(255,215,0,.2);--blue:#4d94ff;--green:#34a853;--red:#f28b82;--border:#253460;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
[data-theme=light]{--bg:#fff;--bg2:#f4f6fb;--card:#fff;--hov:#eef1f9;--t:#14151f;--t2:#565f7a;--t3:#8890a8;--accent:#e6c200;--accent2:#c2a300;--glow:rgba(230,194,0,.18);--blue:#0066CC;--green:#1e8e4e;--red:#d93025;--border:#e2e6f0;--shadow:0 8px 30px rgba(20,22,40,.1);color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--t);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;background-image:radial-gradient(ellipse at 10% 10%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 55%),radial-gradient(ellipse at 90% 40%,color-mix(in srgb,var(--blue) 9%,transparent),transparent 55%)}
.container{width:92%;max-width:1240px;margin:0 auto;padding:0 16px}
a{color:inherit}
header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 0;position:sticky;top:0;z-index:99}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo a{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:1.4rem}
.logo img{width:42px;height:42px;border-radius:10px;box-shadow:0 0 30px var(--glow)}
.nl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nl>a{color:var(--t2);text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 16px;border-radius:var(--r)}
.nl>a:hover{color:var(--t);background:var(--hov)}
.nl>a.login{background:linear-gradient(135deg,var(--blue),#7aacff);color:#fff;border-radius:50px;font-weight:700}
.dd{position:relative}
.dd>button{background:none;border:0;color:var(--t2);font:600 .92rem 'Montserrat';padding:8px 16px;border-radius:var(--r);cursor:pointer}
.dd>button:hover{color:var(--t);background:var(--hov)}
.dd .dc{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:190px;padding:8px 0;box-shadow:var(--shadow)}
.dd.open .dc{display:block}
.dc a{display:flex;gap:10px;align-items:center;padding:10px 18px;color:var(--t2);text-decoration:none;font-size:.9rem;font-weight:500}
.dc a i{color:var(--accent);width:18px}.dc a:hover{background:var(--hov);color:var(--t)}
.burger{display:none;background:none;border:0;color:var(--t);font-size:1.5rem;cursor:pointer}
main{flex:1;padding:50px 0}
.wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:start;max-width:1060px;margin:0 auto}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);padding:6px 16px;border-radius:50px;font-weight:600;font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:18px}
.side{padding-top:20px}
.side h1{font-size:clamp(2rem,4.5vw,2.8rem);font-weight:800;line-height:1.12;letter-spacing:-1px;margin-bottom:16px;background:linear-gradient(135deg,var(--t) 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.side>p{color:var(--t2);font-weight:500;margin-bottom:24px}
.perk{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;transition:.25s}
.perk:hover{border-color:var(--accent);transform:translateX(6px)}
.perk i{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.perk b{display:block;font-size:.92rem}.perk span{font-size:.8rem;color:var(--t2);font-weight:500}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:32px 30px;box-shadow:var(--shadow)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:50px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;color:var(--t2);font:700 .9rem 'Montserrat';padding:10px;border-radius:50px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;box-shadow:0 4px 18px var(--glow)}
.cont{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cont>button:first-child{flex:1;min-width:220px;display:flex;align-items:center;gap:12px;text-align:left;background:color-mix(in srgb,var(--accent) 10%,var(--bg2));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));border-radius:var(--r);padding:10px 14px;color:var(--t);cursor:pointer;font-family:inherit;transition:.2s}
.cont>button:first-child:hover{transform:translateY(-2px);box-shadow:0 6px 22px var(--glow)}
.cont .a{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cont b{display:block;font-size:.92rem}.cont small{color:var(--t2);font-size:.76rem;font-weight:500}.cont .go{margin-left:auto;color:var(--accent)}
.prov{display:grid;gap:10px}
.pbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--t);font:600 .92rem 'Montserrat';cursor:pointer;transition:.25s}
.pbtn:hover{transform:translateY(-2px);border-color:var(--accent)}
.pbtn.dc2 i{color:#5865F2}.pbtn.rb i{color:#e2231a}.pbtn.gg i{color:#ea4335}
.pbtn .soon{position:absolute;right:12px;font-size:.62rem;font-weight:800;text-transform:uppercase;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);padding:3px 9px;border-radius:50px}
.pbtn.off{opacity:.75}
.or{display:flex;align-items:center;gap:12px;color:var(--t3);font-size:.75rem;font-weight:700;text-transform:uppercase;margin:20px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
.f{margin-bottom:14px}
.f label.l{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--t2)}
.inp{position:relative}
.inp>i.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.9rem}
.inp input{width:100%;padding:12px 44px 12px 40px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--t);font:500 .95rem 'Montserrat';outline:0;transition:.2s}
.inp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--t3);cursor:pointer;width:36px;height:36px}
.bar{height:5px;border-radius:5px;background:var(--border);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:.3s}
.hint{font-size:.76rem;color:var(--t3);margin-top:5px;font-weight:500}
.hint.warn{color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--t2);font-weight:500;margin-bottom:10px;cursor:pointer;line-height:1.5}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex-shrink:0}
.chk a{color:var(--accent);font-weight:700;text-decoration:none}.chk a:hover{text-decoration:underline}
.row{display:flex;justify-content:flex-end;margin:-4px 0 16px}
.link{color:var(--accent);font-size:.82rem;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit}
.link:hover{text-decoration:underline}
.btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:50px;border:0;font:700 1rem 'Montserrat';cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;box-shadow:0 8px 30px var(--glow);transition:.25s;text-decoration:none;margin-top:6px}
.btn:hover{transform:translateY(-3px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.sec{background:var(--bg2);color:var(--t);box-shadow:none;border:1px solid var(--border)}
.msg{display:none;padding:11px 14px;border-radius:var(--r);font-size:.85rem;font-weight:600;margin-bottom:16px}
.msg.err{display:block;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.msg.ok{display:block;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.msg.info{display:block;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.note{text-align:center;font-size:.76rem;color:var(--t3);font-weight:500;margin-top:18px}
.hide{display:none!important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.center{text-align:center;padding:10px 0}
.center .big{width:80px;height:80px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;font-size:2rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.center h3{font-size:1.3rem;margin-bottom:6px}.center p{color:var(--t2);font-size:.9rem;margin-bottom:18px}
footer{background:var(--bg2);border-top:1px solid var(--border);padding:44px 0 24px;margin-top:40px}
.ft{display:grid;grid-template-columns:1.2fr 2fr;gap:40px;margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid var(--border)}
.fb{display:flex;flex-direction:column;gap:12px}
.fb img{width:54px;height:54px;border-radius:12px}
.fb .bn{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--t),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.fb p{color:var(--t2);font-size:.88rem;max-width:330px}
.soc{display:flex;gap:10px;flex-wrap:wrap}
.soc a{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--border);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:.25s}
.soc a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}
.fl{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.fc h4{font-size:.92rem;font-weight:700;color:var(--accent);margin-bottom:12px}
.fc ul{list-style:none}.fc li{margin-bottom:6px}
.fc a{color:var(--t2);text-decoration:none;font-weight:500;font-size:.85rem;display:inline-flex;gap:8px;align-items:center}
.fc a:hover{color:var(--accent)}.fc a i{width:15px;font-size:.78rem}
.fbot{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--t2);font-size:.82rem}
.theme{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--t2);cursor:pointer}
.theme:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:992px){.burger{display:block}.nl{display:none;width:100%;flex-direction:column;align-items:stretch;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}.nl.on{display:flex}.dd .dc{position:static;box-shadow:none;border:0;background:none}.ft{grid-template-columns:1fr}.fl{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{order:2;padding-top:0}.box{padding:24px 18px}main{padding:28px 0}}
@media(max-width:560px){.fl{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.acc{max-width:900px;margin:0 auto;display:grid;gap:22px}
.pc{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pav{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;font-size:2.2rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--glow);flex-shrink:0}
.pc h1{font-size:1.7rem;font-weight:800;line-height:1.2;word-break:break-all}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bd{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:4px 12px;border-radius:50px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.bd.b{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.bd.g{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.card2{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:26px;box-shadow:var(--shadow)}
.card2 h2{font-size:1.1rem;font-weight:800;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.card2 h2 i{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kv{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.kv span{display:block;font-size:.72rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.kv b{font-size:.95rem;word-break:break-all}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{width:auto;padding:12px 24px;font-size:.9rem;margin:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;font-size:.85rem;color:var(--t2);border-bottom:1px solid var(--border);font-weight:500}
tr:last-child td{border-bottom:0}
.warn{font-size:.8rem;color:var(--t3);margin-top:12px;font-weight:500}
.msg{display:none;padding:11px 14px;border-radius:var(--r);font-size:.85rem;font-weight:600;margin-top:14px}
.msg.ok{display:block;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.msg.err{display:block;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:50px;border:0;font:700 1rem 'Montserrat';cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14151f;box-shadow:0 8px 30px var(--glow);transition:.25s;text-decoration:none}
.btn:hover{transform:translateY(-3px)}.btn.sec{background:var(--bg2);color:var(--t);box-shadow:none;border:1px solid var(--border)}
ul.dl{list-style:none;display:grid;gap:8px}
ul.dl li{font-size:.86rem;color:var(--t2);font-weight:500;display:flex;gap:10px}
ul.dl i{color:var(--green);margin-top:5px;font-size:.8rem}
.load{text-align:center;padding:60px 0;color:var(--t2)}
.hide{display:none!important}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.pc{flex-direction:column;text-align:center}.badges{justify-content:center}}
.ov{position:fixed;inset:0;background:rgba(5,8,16,.7);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:26px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.md h3{font-size:1.2rem;margin-bottom:8px}.md p{color:var(--t2);font-size:.9rem;margin-bottom:14px}
.md .inp{margin-bottom:12px}.md .inp input{padding-left:14px}
.md .btn{margin-top:4px}
</style>
</head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDNAyhui3Lc_IX0wuot7_Z6Vdf9Bw5A9mE",authDomain:"metro-new-85226.firebaseapp.com",databaseURL:"https://metro-new-85226-default-rtdb.firebaseio.com",projectId:"metro-new-85226",storageBucket:"metro-new-85226.firebasestorage.app",messagingSenderId:"905640751733",appId:"1:905640751733:web:f1ab3a1b119ca1e245fe3c"};
const WORKER="https://metro-new-auth.kirilltyr123.workers.dev";
const AUTH_PAGE="https://kirill12633.github.io/Metro.New.Official/auth/singup/";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const root=document.documentElement;root.setAttribute('data-theme',matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
$('burger').onclick=()=>$('nl').classList.toggle('on');$('ddb').onclick=e=>{e.stopPropagation();$('dd').classList.toggle('open')};
const mm=(id,t,k)=>{const m=$(id);m.className='msg'+(t?' '+k:'');m.textContent=t||''};
const E={not_found:'Игрок не найден',protected:'Нельзя банить себя или других админов',reason_required:'Укажите причину (от 3 символов)',need_2fa:'Для админки нужна 2FA: войдите с кодом из приложения',forbidden:'Нет доступа',auth:'Войдите заново',rate:'Слишком часто'};
onAuthStateChanged(auth,async u=>{
 if(!u||!u.emailVerified){location.replace(AUTH_PAGE+'?next='+encodeURIComponent(location.href));return}
 let role='';try{const s=await getDoc(doc(db,'users',u.uid));role=s.exists()?s.data().role:''}catch(e){}
 if(!['admin','owner'].includes(role)){$('load').textContent='Нет доступа';return}
 $('load').classList.add('hide');$('acc').classList.remove('hide');
 const api=async(p,b)=>{const t=await u.getIdToken(true),r=await fetch(WORKER+p,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b||{})});return{ok:r.ok,j:await r.json().catch(()=>({}))}};
 const td=t=>{const c=document.createElement('td');c.textContent=t;return c};
 async function load(){
  const r=await api('/admin/bans'),tb=$('rows');tb.textContent='';
  if(!r.ok){mm('m1',E[r.j.error]||'Не удалось загрузить список','err');return}
  if(!r.j.bans.length){const tr=document.createElement('tr'),c=td('Банов нет');c.colSpan=4;tr.appendChild(c);tb.appendChild(tr)}
  r.j.bans.forEach(b=>{const tr=document.createElement('tr'),bt=document.createElement('button');bt.className='btn sec';bt.style.cssText='padding:6px 14px;font-size:.8rem;margin:0';bt.textContent='Разбанить';
   bt.onclick=async()=>{const x=await api('/admin/unban',{nickname:b.nickname});mm('m1',x.ok?'Бан снят':(E[x.j.error]||'Ошибка'),x.ok?'ok':'err');load()};
   const bc=document.createElement('td');bc.appendChild(bt);
   tr.append(td(b.nickname||'—'),td(b.until?new Date(b.until).toLocaleString('ru-RU'):'навсегда'),td(b.reason||'—'),bc);tb.appendChild(tr)});
 }
 $('bGo').onclick=async()=>{const r=await api('/admin/ban',{nickname:$('bN').value.trim(),duration:$('bD').value,reason:$('bR').value.trim()});mm('m1',r.ok?'Бан выдан':(E[r.j.error]||'Не удалось выдать бан'),r.ok?'ok':'err');if(r.ok){$('bR').value='';load()}};
 $('pGo').onclick=async()=>{const r=await api('/admin/plan',{nickname:$('pN').value.trim(),plan:$('pP').value,days:Number($('pD').value)||0});mm('m2',r.ok?'Тариф выдан':(E[r.j.error]||'Не удалось выдать тариф'),r.ok?'ok':'err')};
 load();
});
</script>
</body>
</html>
