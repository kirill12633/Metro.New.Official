<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Админ-панель — Трансляции | Metro New</title>

    <meta name="robots" content="noindex, nofollow" />
    <link rel="shortcut icon" href="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png" type="image/png" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --bg-primary: #0d1526;
            --bg-secondary: #131c33;
            --bg-card: #182444;
            --bg-card-hover: #1d2b4f;
            --text-primary: #f2f4fa;
            --text-secondary: #a6b0cc;
            --text-tertiary: #77819e;
            --accent: #FFD700;
            --accent-hover: #ffe14d;
            --accent-light: rgba(255, 215, 0, 0.15);
            --accent-glow: rgba(255, 215, 0, 0.2);
            --blue: #4d94ff;
            --blue-hover: #7aacff;
            --blue-light: rgba(77, 148, 255, 0.15);
            --green: #34a853;
            --green-light: rgba(52, 168, 83, 0.15);
            --red: #f28b82;
            --red-light: rgba(242, 139, 130, 0.15);
            --border: #253460;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.7);
            --input-bg: #182444;
            --input-border: #253460;
            --scrollbar-thumb: #2d3d6b;
            color-scheme: dark;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f6fb;
            --bg-card: #ffffff;
            --bg-card-hover: #eef1f9;
            --text-primary: #14151f;
            --text-secondary: #565f7a;
            --text-tertiary: #8890a8;
            --accent: #e6c200;
            --accent-hover: #c2a300;
            --accent-light: rgba(230, 194, 0, 0.12);
            --accent-glow: rgba(230, 194, 0, 0.18);
            --blue: #0066CC;
            --blue-hover: #0052a3;
            --blue-light: rgba(0, 102, 204, 0.1);
            --green: #1e8e4e;
            --red: #d93025;
            --red-light: rgba(217, 48, 37, 0.1);
            --border: #e2e6f0;
            --shadow: 0 8px 30px rgba(20, 22, 40, 0.1);
            --shadow-lg: 0 16px 40px rgba(20, 22, 40, 0.12);
            --shadow-xl: 0 24px 60px rgba(20, 22, 40, 0.16);
            --input-bg: #f4f6fb;
            --input-border: #e2e6f0;
            --scrollbar-thumb: #d1d6e6;
            color-scheme: light;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 10% 20%, color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, color-mix(in srgb, var(--blue) 8%, transparent) 0%, transparent 60%);
        }

        .container { width: 92%; max-width: 1240px; margin: 0 auto; padding: 0 16px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ===== HEADER ===== */
        header {
            background: color-mix(in srgb, var(--bg-primary) 92%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

        .logo a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 800;
            font-size: 1.6rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .logo span {
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .theme-toggle .fa-sun { opacity: 0; transform: rotate(90deg) scale(0.3); }
        [data-theme="light"] .theme-toggle .fa-sun { opacity: 1; transform: rotate(0deg) scale(1); color: var(--accent); }
        [data-theme="light"] .theme-toggle .fa-moon { opacity: 0; transform: rotate(-90deg) scale(0.3); }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            background: linear-gradient(135deg, var(--blue), var(--blue-hover));
            border-radius: 999px;
            color: #fff !important;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s;
            box-shadow: 0 4px 20px rgba(77, 148, 255, 0.3);
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 35px rgba(77, 148, 255, 0.4); }

        /* ===== PAGE ===== */
        .page { padding: 30px 0 60px; }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title .label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .page-title h1 {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title h1 i { color: var(--accent); -webkit-text-fill-color: var(--accent); }

        /* ===== ACCESS DENIED ===== */
        .access-denied {
            display: none;
            text-align: center;
            padding: 80px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .access-denied.visible { display: block; }

        .access-denied .icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--red-light);
            color: var(--red);
            font-size: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .access-denied h2 {
            font-size: 1.6rem;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .access-denied p {
            color: var(--text-secondary);
            max-width: 480px;
            margin: 0 auto 24px;
        }

        /* ===== ADMIN AREA ===== */
        .admin-area { display: none; }
        .admin-area.visible { display: block; }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            transition: all 0.25s;
        }

        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px var(--accent-glow);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            background: var(--accent-light);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .stat-icon.live { background: var(--red-light); color: var(--red); }
        .stat-icon.planned { background: var(--blue-light); color: var(--blue); }
        .stat-icon.ended { background: var(--bg-secondary); color: var(--text-tertiary); }

        .stat-info { display: flex; flex-direction: column; min-width: 0; }

        .stat-info .value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .stat-info .label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .toolbar .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 220px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 999px;
            padding: 4px 18px;
            transition: all 0.25s;
        }

        .toolbar .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .toolbar .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
        }

        .toolbar .search-box input::placeholder { color: var(--text-tertiary); }

        .toolbar .search-box i { color: var(--text-tertiary); }

        .toolbar select {
            padding: 10px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 999px;
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .toolbar select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
        }

        .btn-primary { background: var(--accent); color: #14151f; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 20px var(--accent-glow); }

        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #d93025; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(242, 139, 130, 0.3); }

        /* ===== TABLE ===== */
        .table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 860px;
        }

        thead {
            background: var(--bg-secondary);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-primary);
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        tbody tr:last-child td { border-bottom: none; }

        .cell-title {
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 200px;
        }

        .cell-title .desc {
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--text-tertiary);
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-badge.live {
            background: var(--red);
            color: #fff;
            animation: pulseBadge 1.5s infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(242, 139, 130, 0); }
        }

        .status-badge.planned {
            background: var(--blue-light);
            color: var(--blue);
            border: 1px solid var(--blue);
        }

        .status-badge.ended {
            background: var(--bg-secondary);
            color: var(--text-tertiary);
            border: 1px solid var(--border);
        }

        .cell-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .cell-actions button {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cell-actions .edit-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
            border-color: var(--accent);
        }

        .cell-actions .delete-btn:hover {
            background: var(--red-light);
            color: var(--red);
            border-color: var(--red);
        }

        .lang-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-row {
            text-align: center;
            padding: 60px 20px !important;
            color: var(--text-tertiary);
        }

        .empty-row i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 28px;
            max-width: 620px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 1.2rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 i { color: var(--accent); }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover { color: var(--red); }

        .modal form { display: flex; flex-direction: column; gap: 14px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group label .req { color: var(--red); }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-group textarea { resize: vertical; min-height: 80px; }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .form-actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            flex: 1;
            min-width: 120px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-actions .btn-submit {
            background: var(--accent);
            color: #14151f;
        }

        .form-actions .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .form-actions .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .form-actions .btn-cancel:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-shadow: var(--shadow-xl);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        .toast.success { border-color: var(--green); box-shadow: 0 8px 30px rgba(52,168,83,0.3); }
        .toast.error { border-color: var(--red); box-shadow: 0 8px 30px rgba(242,139,130,0.3); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .modal { padding: 20px; }
            .page-header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="https://kirill12633.github.io/Metro.New.Official/ru/">
                        <span class="logo-icon">
                            <img src="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png" alt="Metro New" loading="lazy" />
                        </span>
                        <span>Метро New</span>
                    </a>
                </div>

                <div class="nav-right">
                    <a href="https://kirill12633.github.io/Metro.New.Official/ru/broadcasts/" class="back-btn">
                        <i class="fas fa-arrow-left"></i> К трансляциям
                    </a>
                    <button class="theme-toggle" id="themeToggle" title="Сменить тему">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </button>
                    <button id="authBtn" class="auth-btn"><i class="fas fa-sign-in-alt"></i> <span id="authText">Войти</span></button>
                </div>
            </nav>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="container">
            <section class="page">

                <div class="page-header">
                    <div class="page-title">
                        <span class="label">Admin Panel</span>
                        <h1><i class="fas fa-satellite-dish"></i> Управление трансляциями</h1>
                    </div>
                </div>

                <!-- ACCESS DENIED -->
                <div class="access-denied" id="accessDenied">
                    <div class="icon"><i class="fas fa-lock"></i></div>
                    <h2>Доступ запрещён</h2>
                    <p>Эта страница доступна только администраторам. Войдите под аккаунтом с правами администратора.</p>
                    <button class="btn btn-primary" id="loginBtnDenied">
                        <i class="fas fa-sign-in-alt"></i> Войти через Google
                    </button>
                </div>

                <!-- ADMIN AREA -->
                <div class="admin-area" id="adminArea">

                    <!-- STATS -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-list"></i></div>
                            <div class="stat-info">
                                <span class="value" id="statTotal">0</span>
                                <span class="label">Всего</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon live"><i class="fas fa-signal"></i></div>
                            <div class="stat-info">
                                <span class="value" id="statLive">0</span>
                                <span class="label">Live</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon planned"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <span class="value" id="statPlanned">0</span>
                                <span class="label">Запланировано</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon ended"><i class="fas fa-check"></i></div>
                            <div class="stat-info">
                                <span class="value" id="statEnded">0</span>
                                <span class="label">Завершено</span>
                            </div>
                        </div>
                    </div>

                    <!-- TOOLBAR -->
                    <div class="toolbar">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Поиск по названию..." oninput="renderTable()">
                        </div>
                        <select id="statusFilter" onchange="renderTable()">
                            <option value="all">Все статусы</option>
                            <option value="live">🔴 Live</option>
                            <option value="planned">📅 Запланировано</option>
                            <option value="ended">✅ Завершено</option>
                        </select>
                        <button class="btn btn-secondary" onclick="loadBroadcasts()">
                            <i class="fas fa-sync-alt"></i> Обновить
                        </button>
                        <button class="btn btn-primary" onclick="openAddModal()">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>

                    <!-- TABLE -->
                    <div class="table-wrapper">
                        <div class="table-scroll">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Название</th>
                                        <th>Статус</th>
                                        <th>Дата</th>
                                        <th>Язык</th>
                                        <th>Порядок</th>
                                        <th style="text-align:right;">Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </section>
        </div>
    </main>

    <!-- ===== EDIT MODAL ===== -->
    <div class="modal-overlay" id="editOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="editTitle"><i class="fas fa-plus"></i> Добавить трансляцию</h3>
                <button class="modal-close" onclick="closeEdit()"><i class="fas fa-times"></i></button>
            </div>
            <form id="editForm" onsubmit="saveBroadcast(event)">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label for="fTitle">Название <span class="req">*</span></label>
                    <input type="text" id="fTitle" placeholder="Metro New International #12" required />
                </div>

                <div class="form-group">
                    <label for="fDesc">Описание</label>
                    <textarea id="fDesc" placeholder="Краткое описание трансляции"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fDate">Дата <span class="req">*</span></label>
                        <input type="text" id="fDate" placeholder="16.09.2026" required />
                    </div>
                    <div class="form-group">
                        <label for="fTime">Время</label>
                        <input type="text" id="fTime" placeholder="19:00 МСК" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fStatus">Статус <span class="req">*</span></label>
                        <select id="fStatus" required>
                            <option value="planned">📅 Запланировано</option>
                            <option value="live">🔴 В эфире (LIVE)</option>
                            <option value="ended">✅ Завершено</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fLang">Язык <span class="req">*</span></label>
                        <select id="fLang" required>
                            <option value="ru">🇷🇺 Русский</option>
                            <option value="en">🇬🇧 English</option>
                            <option value="de">🇩🇪 Deutsch</option>
                            <option value="fr">🇫🇷 Français</option>
                            <option value="es">🇪🇸 Español</option>
                            <option value="it">🇮🇹 Italiano</option>
                            <option value="pt">🇵🇹 Português</option>
                            <option value="pl">🇵🇱 Polski</option>
                            <option value="tr">🇹🇷 Türkçe</option>
                            <option value="uk">🇺🇦 Українська</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fYoutube">YouTube ID <span class="req">*</span></label>
                    <input type="text" id="fYoutube" placeholder="dQw4w9WgXcQ (часть ссылки после v=)" required />
                </div>

                <div class="form-group">
                    <label for="fOrder">Порядок (больше = выше)</label>
                    <input type="number" id="fOrder" value="0" />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit"><i class="fas fa-save"></i> <span id="submitBtnText">Сохранить</span></button>
                    <button type="button" class="btn-cancel" onclick="closeEdit()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyAVSAXTU1VqF36GJA1pQOfxRxo3_ixW7F4",
            authDomain: "metro-new-admin.firebaseapp.com",
            projectId: "metro-new-admin",
            storageBucket: "metro-new-admin.firebasestorage.app",
            messagingSenderId: "769002010414",
            appId: "1:769002010414:web:bdeb93a7eddc4cab63ecbf"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const COLLECTION = 'metronew_int_live';

        // ===== STATE =====
        let currentUser = null;
        let isAdmin = false;
        let broadcastsData = [];

        // ===== DOM =====
        const tableBody = document.getElementById('tableBody');
        const accessDenied = document.getElementById('accessDenied');
        const adminArea = document.getElementById('adminArea');
        const authBtn = document.getElementById('authBtn');
        const authText = document.getElementById('authText');
        const editOverlay = document.getElementById('editOverlay');
        const editTitle = document.getElementById('editTitle');
        const editForm = document.getElementById('editForm');
        const editId = document.getElementById('editId');
        const submitBtnText = document.getElementById('submitBtnText');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');

        // ===== AUTH =====
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;

            if (user) {
                try {
                    const doc = await db.collection('admins').doc(user.uid).get();
                    isAdmin = doc.exists;
                } catch (error) {
                    console.error('Ошибка проверки прав:', error);
                    isAdmin = false;
                }

                if (isAdmin) {
                    authText.textContent = 'Выйти';
                    authBtn.innerHTML = `<i class="fas fa-sign-out-alt"></i> <span id="authText">Выйти</span>`;
                    accessDenied.classList.remove('visible');
                    adminArea.classList.add('visible');
                    loadBroadcasts();
                } else {
                    authText.textContent = 'Войти';
                    authBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> <span id="authText">Войти</span>`;
                    accessDenied.classList.add('visible');
                    adminArea.classList.remove('visible');
                }
            } else {
                isAdmin = false;
                authText.textContent = 'Войти';
                authBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> <span id="authText">Войти</span>`;
                accessDenied.classList.add('visible');
                adminArea.classList.remove('visible');
            }
        });

        authBtn.addEventListener('click', handleLogin);
        document.getElementById('loginBtnDenied').addEventListener('click', handleLogin);

        function handleLogin() {
            if (currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                auth.signInWithPopup(provider).catch(error => {
                    console.error('Ошибка входа:', error);
                    showToast('Ошибка входа: ' + error.message, 'error');
                });
            }
        }

        // ===== LOAD =====
        async function loadBroadcasts() {
            try {
                const snapshot = await db.collection(COLLECTION).get();

                broadcastsData = [];
                snapshot.forEach(doc => {
                    broadcastsData.push({ id: doc.id, ...doc.data() });
                });

                // Сортировка: live → planned → ended, потом по order
                broadcastsData.sort((a, b) => {
                    const order = { live: 0, planned: 1, ended: 2 };
                    const ao = order[a.status] ?? 3;
                    const bo = order[b.status] ?? 3;
                    if (ao !== bo) return ao - bo;
                    return (b.order ?? 0) - (a.order ?? 0);
                });

                updateStats();
                renderTable();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showToast('Ошибка загрузки: ' + error.message, 'error');
            }
        }

        // ===== STATS =====
        function updateStats() {
            document.getElementById('statTotal').textContent = broadcastsData.length;
            document.getElementById('statLive').textContent = broadcastsData.filter(b => b.status === 'live').length;
            document.getElementById('statPlanned').textContent = broadcastsData.filter(b => b.status === 'planned').length;
            document.getElementById('statEnded').textContent = broadcastsData.filter(b => b.status === 'ended').length;
        }

        // ===== RENDER TABLE =====
        function renderTable() {
            const q = searchInput.value.trim().toLowerCase();
            const status = statusFilter.value;

            let filtered = [...broadcastsData];

            if (q) {
                filtered = filtered.filter(b =>
                    (b.title || '').toLowerCase().includes(q) ||
                    (b.description || '').toLowerCase().includes(q)
                );
            }

            if (status !== 'all') {
                filtered = filtered.filter(b => b.status === status);
            }

            if (filtered.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-row">
                            <i class="fas fa-inbox"></i>
                            ${broadcastsData.length === 0 ? 'Трансляций пока нет' : 'Ничего не найдено'}
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = filtered.map(b => renderRow(b)).join('');
        }

        function renderRow(b) {
            const isLive = b.status === 'live';
            const isPlanned = b.status === 'planned';

            const statusBadge = isLive
                ? `<span class="status-badge live">🔴 Live</span>`
                : isPlanned
                    ? `<span class="status-badge planned">📅 Запланировано</span>`
                    : `<span class="status-badge ended">✅ Завершено</span>`;

            const flag = LANG_FLAGS[b.language] || '🌐';

            return `
                <tr>
                    <td>
                        <div class="cell-title">
                            ${escapeHtml(b.title || 'Без названия')}
                            ${b.description ? `<span class="desc">${escapeHtml(b.description)}</span>` : ''}
                        </div>
                    </td>
                    <td>${statusBadge}</td>
                    <td>${escapeHtml(b.date || '—')}${b.time ? `<br><span style="font-size:0.75rem;color:var(--text-tertiary);">${escapeHtml(b.time)}</span>` : ''}</td>
                    <td><span class="lang-tag">${flag} ${(b.language || 'ru').toUpperCase()}</span></td>
                    <td>${b.order ?? 0}</td>
                    <td>
                        <div class="cell-actions">
                            <button class="edit-btn" onclick="openEditModal('${b.id}')" title="Редактировать">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="delete-btn" onclick="deleteBroadcast('${b.id}')" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }

        const LANG_FLAGS = {
            ru: '🇷🇺', en: '🇬🇧', de: '🇩🇪', fr: '🇫🇷', es: '🇪🇸',
            it: '🇮🇹', pt: '🇵🇹', pl: '🇵🇱', tr: '🇹🇷', uk: '🇺🇦'
        };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ===== EDIT MODAL =====
        function openAddModal() {
            if (!isAdmin) return;
            editId.value = '';
            editTitle.innerHTML = '<i class="fas fa-plus"></i> Добавить трансляцию';
            submitBtnText.textContent = 'Сохранить';
            document.getElementById('fTitle').value = '';
            document.getElementById('fDesc').value = '';
            document.getElementById('fDate').value = '';
            document.getElementById('fTime').value = '';
            document.getElementById('fStatus').value = 'planned';
            document.getElementById('fLang').value = 'ru';
            document.getElementById('fYoutube').value = '';
            document.getElementById('fOrder').value = '0';
            editOverlay.classList.add('active');
        }

        function openEditModal(id) {
            if (!isAdmin) return;
            const item = broadcastsData.find(b => b.id === id);
            if (!item) return;

            editId.value = id;
            editTitle.innerHTML = '<i class="fas fa-pen"></i> Редактировать трансляцию';
            submitBtnText.textContent = 'Обновить';
            document.getElementById('fTitle').value = item.title || '';
            document.getElementById('fDesc').value = item.description || '';
            document.getElementById('fDate').value = item.date || '';
            document.getElementById('fTime').value = item.time || '';
            document.getElementById('fStatus').value = item.status || 'planned';
            document.getElementById('fLang').value = item.language || 'ru';
            document.getElementById('fYoutube').value = item.youtubeId || '';
            document.getElementById('fOrder').value = item.order ?? 0;
            editOverlay.classList.add('active');
        }

        function closeEdit() { editOverlay.classList.remove('active'); }

        editOverlay.addEventListener('click', e => {
            if (e.target === editOverlay) closeEdit();
        });

        // ===== SAVE =====
        async function saveBroadcast(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const id = editId.value;
            const data = {
                title: document.getElementById('fTitle').value.trim(),
                description: document.getElementById('fDesc').value.trim(),
                date: document.getElementById('fDate').value.trim(),
                time: document.getElementById('fTime').value.trim(),
                status: document.getElementById('fStatus').value,
                language: document.getElementById('fLang').value,
                youtubeId: document.getElementById('fYoutube').value.trim(),
                order: Number(document.getElementById('fOrder').value) || 0,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (!data.title || !data.date || !data.youtubeId) {
                showToast('Заполните все обязательные поля', 'error');
                return;
            }

            try {
                if (id) {
                    await db.collection(COLLECTION).doc(id).update(data);
                    showToast('✅ Трансляция обновлена!', 'success');
                } else {
                    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection(COLLECTION).add(data);
                    showToast('✅ Трансляция добавлена!', 'success');
                }
                closeEdit();
                loadBroadcasts();
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                showToast('❌ Ошибка: ' + error.message, 'error');
            }
        }

        // ===== DELETE =====
        async function deleteBroadcast(id) {
            if (!isAdmin) return;
            if (!confirm('Удалить эту трансляцию?')) return;

            try {
                await db.collection(COLLECTION).doc(id).delete();
                showToast('🗑️ Трансляция удалена', 'success');
                loadBroadcasts();
            } catch (error) {
                console.error('Ошибка удаления:', error);
                showToast('❌ Ошибка удаления', 'error');
            }
        }

        // ===== TOAST =====
        function showToast(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${escapeHtml(message)}</span>
            `;

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        // ===== THEME =====
        const THEME_KEY = 'metro_new_theme';
        const root = document.documentElement;

        function applyTheme(theme) { root.setAttribute('data-theme', theme); }

        function getInitialTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'light' || saved === 'dark') return saved;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        let currentTheme = getInitialTheme();
        applyTheme(currentTheme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
            localStorage.setItem(THEME_KEY, currentTheme);
        });

        // ===== ESC =====
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeEdit();
        });

        // ===== GLOBAL =====
        window.loadBroadcasts = loadBroadcasts;
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.closeEdit = closeEdit;
        window.saveBroadcast = saveBroadcast;
        window.deleteBroadcast = deleteBroadcast;
        window.renderTable = renderTable;

        console.log('👑 Админ-панель трансляций загружена');
        console.log('📌 Коллекция:', COLLECTION);
    </script>

    <script src="https://kirill12633.github.io/Metro.New.Official/ru/js/lang-config.js"></script>
    <script src="https://kirill12633.github.io/Metro.New.Official/ru/js/cookies.js"></script>
    <script src="https://kirill12633.github.io/Metro.New.Official/ru/js/update-docs.js"></script>
    <script src="https://kirill12633.github.io/Metro.New.Official/ru/js/link-protector.js"></script>
</body>
</html>
