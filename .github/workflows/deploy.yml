name: Deploy Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase configuration
        id: config
        shell: bash
        run: |
          if [[ -f firebase.json && -f .firebaserc ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Firebase deploy: this repository is currently a static site without firebase.json and/or .firebaserc. Vercel/GitHub Pages deployments run separately."
          fi

      - name: Deploy to Firebase
        if: steps.config.outputs.configured == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECTID: ${{ secrets.FIREBASE_PROJECTID }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_TOKEN" || -z "$FIREBASE_PROJECTID" ]]; then
            echo "::error::Firebase config exists but FIREBASE_TOKEN or FIREBASE_PROJECTID secret is missing."
            exit 1
          fi
          npx --yes firebase-tools deploy --project "$FIREBASE_PROJECTID" --non-interactive --token "$FIREBASE_TOKEN"
