name: Refresh Metro New news feed

on:
  push:
    paths:
      - ".github/workflows/update-news.yml"
      - "scripts/update-news-feed.py"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch real article metadata from GDELT
        run: python scripts/update-news-feed.py

      - name: Commit feed if changed
        shell: bash
        run: |
          if git diff --quiet -- news/news-feed.json; then
            echo "News feed has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news-feed.json
          git commit -m "Refresh Metro New news feed"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
