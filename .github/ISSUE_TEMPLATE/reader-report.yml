name: Предложить репортаж Metro New
description: Отправьте редакции новость или свидетельство события на проверку
title: "[Репортаж] "
body:
  - type: markdown
    attributes:
      value: |
        Материал будет опубликован только после проверки редакцией. Не отправляйте личные данные других людей без их согласия.
  - type: input
    id: headline
    attributes:
      label: Заголовок или тема
      placeholder: Коротко опишите событие
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Что произошло?
      description: Укажите место, дату и проверяемые факты.
      placeholder: Опишите событие своими словами
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ссылка на источник или подтверждение
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Контакт для обратной связи (необязательно)
      description: Не указывайте здесь пароли или другие секретные данные.
    validations:
      required: false
